name: Local-equivalent quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows quality suite
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: x64
          check-latest: false

      - name: Set up pinned uv without cache upload
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          checksum: acfde570451cfdb8689fa159a138ee805ba4e241c466432750302c86254b0984
          enable-cache: false
          restore-cache: false
          save-cache: false
          download-from-astral-mirror: false

      - name: Stage copy-owned worker CPython
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (& python -I -S -c "import sys; print(sys.base_prefix)").Trim()
          if (-not [IO.Path]::IsPathFullyQualified($source)) {
            throw "The setup-python runtime root is not absolute."
          }
          $destination = Join-Path $env:RUNNER_TEMP "PaperWorkShell-ci-python"
          if (Test-Path -LiteralPath $destination) {
            throw "The copy-owned worker runtime destination already exists."
          }
          Copy-Item -LiteralPath $source -Destination $destination -Recurse -Force
          $python = Join-Path $destination "python.exe"
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "The copy-owned worker interpreter was not staged."
          }
          $reported = (& $python -I -S -c "import sys; print(sys.base_prefix)").Trim()
          $expectedRoot = [IO.Path]::GetFullPath($destination)
          $reportedRoot = [IO.Path]::GetFullPath($reported)
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($expectedRoot, $reportedRoot)) {
            throw "The staged interpreter did not bind to the copy-owned runtime."
          }
          "UV_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and verify Gitleaks 8.30.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks-8.30.1.zip"
          $destination = Join-Path $env:RUNNER_TEMP "gitleaks-8.30.1"
          $uri = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
          $expected = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Gitleaks archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $destination "gitleaks.exe") version

      - name: Install and verify qpdf 12.3.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "qpdf-12.3.2-msvc64.zip"
          $destination = Join-Path $env:ProgramFiles "PaperWorkShell-ci-qpdf-12.3.2"
          $uri = "https://github.com/qpdf/qpdf/releases/download/v12.3.2/qpdf-12.3.2-msvc64.zip"
          $expected = "8941870a604e7c87ed24566b038d46c24ce76616254d2383c578f60c0677f202"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "qpdf archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $qpdf = Join-Path $destination "qpdf-12.3.2-msvc64/bin/qpdf.exe"
          if (-not (Test-Path -LiteralPath $qpdf -PathType Leaf)) {
            throw "qpdf executable was not found in the reviewed archive layout."
          }
          $version = (& $qpdf --version)[0]
          if ($version -ne "qpdf version 12.3.2") {
            throw "qpdf version mismatch."
          }
          "PWS_QPDF_EXECUTABLE=$qpdf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap locked environment
        run: python tools/dev.py bootstrap

      - name: Install renderer comparison dependencies
        run: uv sync --locked --group renderer-evaluation

      - name: Run local-equivalent quality suite
        run: python tools/dev.py check
