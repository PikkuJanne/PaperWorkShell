      nearest and outward continuous-edge quantization are explicit.
    - Rational crop/quarter-turn math and nearest half-up point quantization give exact manifest replay. PDF,
      viewport, DPR, and /UserUnit geometry that cannot preserve the documented millionth/ULP round-trip bound
      fails closed; exact outer edges normalize harmless float residue only after bounds are proved.
    - Fixed-seed randomized properties cover all intrinsic/user quarter-turn combinations, non-zero origins,
      crops, mixed page sizes, raster sizes, viewport offsets/zoom, and display scales. Known quadrant centres
      match all four colours in every existing approved intrinsic/additional renderer golden; no golden was
      refreshed. Supplemental independent stress found no accepted out-of-bound round trip across 500000 PDF,
      120000 viewport, 300000 DPR, 200000 screen-edge, and 100000 /UserUnit trials.
    - Coordinate errors and PDF geometry reprs are closed and non-disclosing; hostile mapping/comparison inputs
      are regression-tested. This pure non-UI task adds no control or interaction and changes no accessibility
      behavior. It does not claim deskew alignment, overlay rendering, font fidelity, OCR accuracy, PDF/UA,
