  title: Replace the native application presentation with TRACE
  kind: implementation
  priority: P0
  effort: L
  status: done
  critical_path: false
  depends_on:
  - PWS-0810
  decision_refs:
  - PWS-D005
  - PWS-D009
  - PWS-D010
  - PWS-D011
  - PWS-D012
  - PWS-D013
  - PWS-D014
  - PWS-D029
  - PWS-D030
  - PWS-D037
  - PWS-D038
  - PWS-D042
  - PWS-D043
  objective: Ship the approved TRACE presentation as PaperWorkShell's normal native interface.
  deliverables:
  - Native TRACE chooser, workbench, arrangement, editor, progress, help and export surfaces.
  - Shared commands, page and recipe links, scoped results, portable recipes and bounded local PowerShell execution.
  - Private Windows installer and exact installed, standard-user acceptance evidence.
  acceptance_criteria:
  - Every existing supported route works through TRACE and normal launch has one active shell.
  - Semantic edits invalidate applicable results while view changes preserve them.
  - Saved cases, worker isolation, verified output, collision handling and source preservation retain their guarantees.
  - The bounded headless path uses existing validated operations, offline runtime and fail-closed recipe admission.
  verification:
  - Exercise focused native, worker, accessibility and failure-path checks.
  - Build offline, install through the authorized test guest, rehearse representative workflows and inspect outputs.
  - Verify supported launcher routes, keyboard and 200 percent scaling.
  risk_tags:
  - desktop-presentation
  - accessibility
  - offline-processing
  - installed-runtime
  blocker: null
  evidence:
    completed_at: '2026-11-25'
    revision: candidate:pws0813-trace-engineering-b8
    commands:
    - "tools/dev.py test-accessibility passed 359 tests on B4 source."
    - "Focused TRACE, assisted use, signature, export, OCR settings, privacy and lifecycle suite passed 180 tests."
    - "Format check, lint, mypy, localization, schemas, documentation, task graph and import and portfolio boundaries passed."
    - "Offline installer stage and compile bound 336 application files. Standard-user PWS-Test replacement preserved 860 inventoried entries."
    - "B5 native contrast regression failed on B4 and passed after the fix. All 360 accessibility tests and 76 focused unit tests passed. Standard-user B5 Setup preserved 868 entries and verified all 3,210 installed members. Windows Aquatic selection and focus passed at native 96 DPI."
    - "B6 from a3246304da09dd98c095e53a2a8f408d4f997385 restored v1 structural checks, rejected a same-size changed PDF, verified the exact retained PDF and required fresh selection after restart. Standard-user replacement preserved 868 entries and verified 3,210 installed files."
    - "The installed B6 current-plan summary remained visible in Exported. The regression failed on B6 source and passed after dead56ed4e695f7b83b5af3e8c01e7f382cb9b31. The corrected source passed 103 focused tests with one Windows symlink skip and all 360 native accessibility tests."
    - "Installed B7 confirmed the Exported label fix, saved core marks in Planned and the unedited Source view. The combined four-page package and its text summary passed independent inspection. Exact installed limited Interactive batch output matched B1 and PowerShell bytes."
    - "Exact B8 source passed 243 focused tests with one Windows symlink capability skip, 360 native accessibility tests, three serial containment and isolation tests, and the flattened-output bound failure path. Three obsolete-preview tests passed after fixture repair. Ruff, strict typing, localization, schemas, docs, task graph and both boundaries passed."
    - "B8 Setup verified 3,210 installed files and preserved all 889 retained entries. Native 96- and 192-DPI captures confirmed the long Recipe configuration wraps, with named keyboard focus and Ctrl+K search at 192 DPI. The offline guest returned to its original resolution, scale and contrast."
    notes:
    - "The TRACE implementation and exact B4 verification are recorded in docs/development/pws0813-trace.md."
    - "The continuation records B5 source, installer and native contrast evidence."
    - "The continuation records B6 reopen evidence, B7 package and batch evidence, the B7 narrow-pane failure, and exact B8 source, installer and native fix verification."
    - "The bounded offline console path was verified in the signed-in standard-user session. Logged-out batch admission was denied by the existing Windows account policy. The signed release and M8 release gate retain their separate prerequisites."
    - "The TRACE continuation records the separate baseline scan verification under the approved ADR 0021 amendment. Both registered scans passed in the complete linked repository with the 768 MiB development work cap, the 50,000-record cap, and full ref, index, and working-file coverage."

- id: PWS-0814
  milestone: M8
  title: Automate and verify setup for the installed Windows application
  kind: implementation
  priority: P0
  effort: L
  status: done
  critical_path: false
  depends_on:
  - PWS-0813
  decision_refs:
  - PWS-D003
  - PWS-D005
  - PWS-D009
  - PWS-D013
  - PWS-D028
  - PWS-D029
  - PWS-D034
  - PWS-D042
  - PWS-D043
  objective: Install and verify an explicitly identified TRACE build from a prepared artifact
    on an authorized Windows 11 x64 target using the supported per-user installation.
  deliverables:
  - One executable setup entry point and documented starting state.
  - Evidence from the exact installed launcher, an offline synthetic import/export/reopen,
    a safe repeat run, and a controlled recovery check.
  acceptance_criteria:
  - Setup checks the target environment, authenticates the intended installer against a
    trusted digest, and supports the documented per-user scope and packaged runtime.
  - Verification identifies the resulting installation and successful ordinary launch.
  - Installed document processing works offline. A synthetic input stays byte-identical
    and the newly exported PDF independently reopens with usable content.
  - Setup can run again safely, reassesses actual state and reports precise recovery steps
    for failures without deleting cases, forcing a restart or weakening execution policy.
  verification:
  - Run the focused setup and governance checks, including artifact-refusal coverage.
  - Execute the documented entry point on the authorized target and record install, launch,
    offline processing, output inspection, repeat behavior and controlled recovery.
  risk_tags:
  - installer
  - recovery
  - offline-processing
  - data-integrity
  blocker: null
  evidence:
    completed_at: '2026-11-26'
    revision: 'candidate:pws0813-trace-engineering-b8'
    commands:
    - Setup-PaperWorkShell.exe --installer PaperWorkShell-pws0813-trace-engineering-b8-win-x64-UNSIGNED.exe --receipt installer-receipt.json --receipt-sha256 145d9efeb0ace1e24e43dd1543a48c0433dac2aad2f764fb4139238c4b4461bc --accept-microsoft-terms a5cdf1136b18611fc5235c657b7ad113a9ac338abe6c1af3c299205d9492c718 --repair
    - Setup-PaperWorkShell.exe repeat with the same receipt and no --repair flag
    - python -m pytest tests/integration/test_windows_automated_setup.py
    - python tools/dev.py validate-task-graph
    - python tools/dev.py validate-portfolio-boundary
    notes:
    - docs/development/pws0814-automated-setup.md records the exact launcher and package,
      native per-user repair and launch, offline GUI import/export and independent PDF
      reopening, early failure paths, and successful verification and reuse on repeat.
    - Trusted signing remains a separate public-delivery prerequisite.
