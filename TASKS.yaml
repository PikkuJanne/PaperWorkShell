- id: PWS-0008
  milestone: M0
  title: Define worker RPC protocol v1
  kind: implementation
  priority: P0
  effort: L
  status: done
  critical_path: true
  depends_on:
  - PWS-0002
  - PWS-0004
  decision_refs:
  - PWS-D012
  - PWS-D013
  - PWS-D036
  - PWS-D038
  objective: Create a versioned, validated, structured protocol for worker lifecycle, operations, progress, cancellation,
    errors, and capability discovery.
  deliverables:
  - RPC message schema and typed models
  - Request IDs, operation IDs, progress, cancellation, result, and error envelopes
  - Capability/version negotiation
  - Malformed-message and incompatible-version fixtures
  acceptance_criteria:
  - Messages contain internal IDs and case-relative references, not arbitrary shell strings.
  - The protocol supports start, progress, cancel, completion, timeout, worker-fault, and capability reporting.
  - Unknown message types and versions fail closed with a sanitized protocol error.
  - Raw third-party exception text is not part of the public RPC contract.
  verification:
  - Round-trip serialize every message type.
  - Reject malformed, oversized, unknown-version, and path-escape messages.
  - Fuzz or property-test message decoding at a basic level.
  risk_tags:
  - ipc
  - security
  - compatibility
  blocker: null
