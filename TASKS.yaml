  - Assignment is available via keyboard menus/dialogs as well as drag-and-drop.
  - Automated suggestions remain unconfirmed until the user accepts them.
  - Unassigned pages remain visible and detectable.
  - Assignments survive save/reopen and support undo/redo where appropriate.
  verification:
