    notes:
    - The pure standard-library domain model names normalized full-page millionths, raw PDF user space,
      typographic points, continuous raster edges, logical screen coordinates, and device pixels. Intrinsic
      orientation, MediaBox/CropBox selection, manifest crop, manifest quarter-turn, actual raster dimensions,
