      task-evidence tree; 540 Python files were formatted, linted, and strictly typed, all 13 import layers across 189
      source files were valid, and all 4267 unit tests passed serially
    - python -m tools.dev test-integration - passed serially; 431 tests passed with 10 disclosed Windows
      capability/environment skips in 2925.23 seconds, including the validating Windows manifest save/reopen and
