- id: PWS-0001
  milestone: M0
  title: Bootstrap repository and pin the development toolchain
  kind: implementation
  priority: P0
  effort: M
  status: done
  critical_path: true
  depends_on: []
  decision_refs:
  - PWS-D001
  - PWS-D003
  - PWS-D004
  - PWS-D014
  - PWS-D034
  objective: Create a reproducible Python project baseline suitable for a Windows-first PySide6 application without
    adding feature dependencies.
  deliverables:
  - Project metadata and internal package name `paperworkshell`
  - Pinned supported CPython minor and dependency workflow
  - Environment bootstrap and lock/reproducibility mechanism
  - Baseline ignore rules and developer command entry points
  - ADR documenting toolchain choice and Windows implications
  acceptance_criteria:
  - A clean environment can install/bootstrap the development project using documented commands.
  - The `paperworkshell` package imports successfully.
  - The user-facing name remains PaperWorkShell.
  - No PDF, OCR, renderer, cloud, signing, or real-document dependency/fixture is added.
  - TASKS.yaml can be parsed and graph-validated with a documented bootstrap command or script.
  verification:
  - Run clean bootstrap on the available development environment.
  - Import `paperworkshell` in a fresh interpreter.
  - Run task schema and DAG validation.
