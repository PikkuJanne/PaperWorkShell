schema_version: 1
project: PaperWorkShell
task_graph_version: 0.3.0
frozen_at: '2026-08-14'
roadmap_file: ROADMAP.md
decision_file: DECISIONS.md
agent_contract_file: AGENTS.md
schema_file: TASKS.schema.json
release_targets:
  v0.1:
    through_milestone: M4
    gate_task: PWS-0409
    permanent_redaction_included: false
  v1.0:
    through_milestone: M8
    gate_task: PWS-0808
    permanent_redaction_included: true
status_values:
- planned
- ready
- in_progress
- review
- done
- blocked
- deferred
priority_order:
- P0
- P1
- P2
effort_values:
- S
- M
- L
- XL
graph_rules:
  dependency_semantics: A task may start only when every task in depends_on has status done.
  default_selection:
  - lowest incomplete milestone
  - highest priority using P0, P1, P2
  - critical_path true before false
  - ascending task id
  one_task_per_change: true
  gate_requires_all_dependencies_done: true
  decision_refs_must_exist: true
  cycles_forbidden: true
definition_of_done_ref: AGENTS.md#16-definition-of-done-checklist
milestones:
- id: M0
  name: Product contract and foundation
  release_target: development baseline
  objective: Establish a reproducible repository, architecture boundaries, schemas, threat model, dependency policy,
    and synthetic corpus before feature work.
  gate_task: PWS-0010
- id: M1
  name: Reliable end-to-end vertical slice
  release_target: architecture proof
  objective: Create, import, organize, export, verify, autosave, and recover a local PDF case without changing originals.
  gate_task: PWS-0114
- id: M2
  name: Image intake and OCR
  release_target: mixed-document workflow
  objective: Add JPEG/PNG intake, reviewable scan cleanup, local OCR, quality warnings, cancellation, and bounded
    processing.
  gate_task: PWS-0209
- id: M3
  name: Filling and overlays
  release_target: basic form completion
  objective: Add reliable visual overlays, keyboard placement, undo/redo, and flattened viewer-compatible export.
  gate_task: PWS-0308
- id: M4
  name: Templates and preflight
  release_target: v0.1 pilot
  objective: Deliver the guided generic portal packet, checklist, constraints, multi-output export, and concrete
    package summary.
  gate_task: PWS-0409
- id: M5
  name: Compression and compatibility
  release_target: portal robustness
  objective: Meet common size and compatibility constraints without silent loss of legibility.
  gate_task: PWS-0507
- id: M6
  name: Permanent redaction
  release_target: security-gated capability
  objective: Implement full-page redaction reconstruction and adversarial verification that blocks unsafe export.
  gate_task: PWS-0608
- id: M7
  name: Accessibility, localization, and assisted mode
  release_target: inclusive pilot readiness
  objective: Complete keyboard and NVDA workflow, scalable UI, localization framework, consent, retention, and deletion
    controls.
  gate_task: PWS-0707
- id: M8
  name: Release hardening
  release_target: v1.0 candidate
  objective: Ship a signed, updateable, documented, migratable, independently verifiable Windows release with pinned
    dependencies, an SBOM, and a frozen black-box release envelope.
  gate_task: PWS-0808
